<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><link rel="manifest" href="manifest.json"><title>Employee Tabs</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:18px 16px 10px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#111;z-index:2}h1{font-size:24px;margin:0}.sub{color:#999;font-size:13px;margin-top:3px}button{border:0;border-radius:12px;padding:13px 10px;font-size:16px;font-weight:700;background:#2a2a2a;color:white}.add{background:#fff;color:#111;padding:10px 15px}main{padding:8px 12px 30px}.card{background:#1d1d1f;border-radius:18px;padding:16px;margin:10px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.name{font-size:20px;font-weight:750}.balance{font-size:32px;font-weight:800;margin:12px 0}.limit{font-size:12px;color:#888}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.grid button{padding:12px 4px;font-size:14px}.plus{background:#173b24}.minus{background:#3b1d20}.actions{display:flex;gap:8px;margin-top:10px}.paid{flex:1;background:#444}.delete{color:#aaa}.empty{text-align:center;color:#888;padding:50px 20px}dialog{border:0;border-radius:18px;background:#202020;color:white;width:min(92%,380px);padding:20px}dialog::backdrop{background:#000b}input{width:100%;padding:14px;border-radius:12px;border:1px solid #444;background:#111;color:white;font-size:18px;margin:12px 0}.modal-actions{display:flex;gap:8px}.modal-actions button{flex:1}</style></head><body><header><div><h1>Employee Tabs</h1><div class="sub">Max $25.00 • nickel increments</div></div><button class="add" id="addBtn">＋ Add</button></header><main id="list"></main><dialog id="dlg"><h2 style="margin:0">Add employee</h2><input id="nameInput" maxlength="40" placeholder="Employee name" autocomplete="off"><div class="modal-actions"><button id="cancelBtn">Cancel</button><button class="add" id="saveBtn">Add</button></div></dialog><script>const KEY="employee-tabs-v1",MAX=25;let data=JSON.parse(localStorage.getItem(KEY)||"[]");const $=id=>document.getElementById(id),money=n=>"$"+n.toFixed(2);function save(){localStorage.setItem(KEY,JSON.stringify(data))}function adjust(i,d){let n=Math.round((data[i].balance+d)*20)/20;if(n<0)n=0;if(n>MAX)n=MAX;data[i].balance=n;save();render()}function render(){let list=$("list");list.innerHTML="";if(!data.length){list.innerHTML='<div class="empty">No employees yet.<br>Tap ＋ Add to start.</div>';return}data.forEach((e,i)=>{let c=document.createElement("section");c.className="card";c.innerHTML='<div class="row"><div class="name"></div><div class="limit">$25 max</div></div><div class="balance">'+money(e.balance)+'</div><div class="grid"><button class="minus" data-d="-10">−$10</button><button class="minus" data-d="-5">−$5</button><button class="minus" data-d="-1">−$1</button><button class="minus" data-d="-.25">−$0.25</button><button class="plus" data-d=".25">+$0.25</button><button class="plus" data-d=".10">+$0.10</button><button class="plus" data-d=".05">+$0.05</button><button class="plus" data-d="1">+$1</button></div><div class="grid"><button class="minus" data-d="-.10">−$0.10</button><button class="minus" data-d="-.05">−$0.05</button><button class="plus" data-d="5">+$5</button><button class="plus" data-d="10">+$10</button></div><div class="actions"><button class="paid">PAID / RESET</button><button class="delete">Delete</button></div>';c.querySelector(".name").textContent=e.name;c.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>adjust(i,Number(b.dataset.d)));c.querySelector(".paid").onclick=()=>{if(confirm("Reset "+e.name+"'s tab to $0.00?")){data[i].balance=0;save();render()}};c.querySelector(".delete").onclick=()=>{if(confirm("Delete "+e.name+"?")){data.splice(i,1);save();render()}};list.appendChild(c)})}$("addBtn").onclick=()=>{$("nameInput").value="";$("dlg").showModal();setTimeout(()=>$("nameInput").focus(),50)};$("cancelBtn").onclick=()=>$("dlg").close();$("saveBtn").onclick=()=>{let n=$("nameInput").value.trim();if(!n)return;data.push({name:n,balance:0});save();$("dlg").close();render()};$("nameInput").onkeydown=e=>{if(e.key==="Enter")$("saveBtn").click()};render();</script></body></html>
